name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare app
        run: |
          mkdir -p www
          cp index.html www/index.html
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          cat > capacitor.config.json <<'CFG'
          {
            "appId": "com.ahmad.trix",
            "appName": "دفتر التركس",
            "webDir": "www",
            "backgroundColor": "#0A2A21"
          }
          CFG
      - run: npx cap add android
      - name: App icon
        continue-on-error: true
        run: |
          pip install pillow
          cat > mk_icon.py <<'PY'
          from PIL import Image, ImageDraw, ImageFilter
          import math, os
          S=2; W=1024*S
          IVORY=(246,240,222,255); EDGE=(206,194,160,255); RED=(190,38,44,255); INK=(28,36,32,255)
          SPINE=(150,34,38,255); SPINE_D=(104,22,26,255); GOLD=(224,178,60,255); GOLD_D=(150,106,16,255)
          PAGE=(232,224,200,255); PAGE_L=(200,190,160,255)
          def hp(cx,cy,size,n=240,flip=False):
              pts=[]
              for i in range(n):
                  t=2*math.pi*i/n
                  x=16*math.sin(t)**3
                  y=13*math.cos(t)-5*math.cos(2*t)-2*math.cos(3*t)-math.cos(4*t)
                  if flip: y=-y
                  pts.append((cx+x*size/32, cy-y*size/32))
              return pts
          def heart(d,cx,cy,s,c): d.polygon(hp(cx,cy,s),fill=c)
          def diamond(d,cx,cy,s,c):
              h=s*0.62; w=s*0.46
              d.polygon([(cx,cy-h),(cx+w,cy),(cx,cy+h),(cx-w,cy)],fill=c)
          def spade(d,cx,cy,s,c):
              d.polygon(hp(cx,cy-s*0.06,s,flip=True),fill=c)
              d.polygon([(cx,cy+s*0.05),(cx-s*0.2,cy+s*0.55),(cx+s*0.2,cy+s*0.55)],fill=c)
          def club(d,cx,cy,s,c):
              r=s*0.22
              for ox,oy in [(0,-s*0.2),(-s*0.24,s*0.08),(s*0.24,s*0.08)]:
                  d.ellipse([cx+ox-r,cy+oy-r,cx+ox+r,cy+oy+r],fill=c)
              d.ellipse([cx-r,cy-r*0.3,cx+r,cy+r*1.2],fill=c)
              d.polygon([(cx,cy),(cx-s*0.2,cy+s*0.58),(cx+s*0.2,cy+s*0.58)],fill=c)
          fg=Image.new('RGBA',(W,W),(0,0,0,0))
          cw,ch=420*S,580*S
          x0=(W-cw)//2+10*S; y0=(W-ch)//2-6*S; rad=26*S
          sh=Image.new('RGBA',(W,W),(0,0,0,0))
          ImageDraw.Draw(sh).rounded_rectangle([x0+8*S,y0+16*S,x0+cw+22*S,y0+ch+26*S],radius=rad,fill=(0,0,0,120))
          fg=Image.alpha_composite(fg,sh.filter(ImageFilter.GaussianBlur(16*S)))
          d=ImageDraw.Draw(fg)
          for o,col in [(20,PAGE_L),(13,PAGE),(6,PAGE_L)]:
              d.rounded_rectangle([x0+o*S,y0+o*S,x0+cw+o*S,y0+ch+o*S],radius=rad,fill=col)
          d.rounded_rectangle([x0,y0,x0+cw,y0+ch],radius=rad,fill=IVORY,outline=EDGE,width=4*S)
          sp=78*S
          spine=Image.new('RGBA',(W,W),(0,0,0,0))
          sd=ImageDraw.Draw(spine)
          sd.rounded_rectangle([x0,y0,x0+sp+rad,y0+ch],radius=rad,fill=SPINE)
          sd.rectangle([x0+sp,y0-2*S,x0+sp+rad+2*S,y0+ch+2*S],fill=(0,0,0,0))
          fg=Image.alpha_composite(fg,spine)
          d=ImageDraw.Draw(fg)
          d.line([(x0+sp,y0+4*S),(x0+sp,y0+ch-4*S)],fill=SPINE_D,width=5*S)
          fx0=x0+sp+26*S; fx1=x0+cw-26*S; fy0=y0+28*S; fy1=y0+ch-28*S
          d.rounded_rectangle([fx0,fy0,fx1,fy1],radius=14*S,outline=(176,48,50,255),width=5*S)
          d.rounded_rectangle([fx0+14*S,fy0+14*S,fx1-14*S,fy1-14*S],radius=8*S,outline=(214,150,140,255),width=3*S)
          px0=fx0+14*S; px1=fx1-14*S; py0=fy0+14*S; py1=fy1-14*S
          cx1=px0+(px1-px0)*0.27; cx2=px0+(px1-px0)*0.73
          cy1=py0+(py1-py0)*0.27; cy2=py0+(py1-py0)*0.73
          sz=118*S
          spade(d,cx1,cy1,sz,INK); heart(d,cx2,cy1,sz,RED)
          diamond(d,cx1,cy2,sz*1.05,RED); club(d,cx2,cy2,sz,INK)
          for i in range(7):
              ry=y0+ch*(i+0.7)/7.1
              d.ellipse([x0-30*S,ry-13*S,x0+30*S,ry+13*S],outline=GOLD_D,width=8*S)
              d.ellipse([x0-30*S,ry-13*S,x0+30*S,ry+13*S],outline=GOLD,width=4*S)
              d.ellipse([x0+8*S,ry-8*S,x0+24*S,ry+8*S],fill=SPINE_D)
          rx=x0+cw*0.78
          d.polygon([(rx,y0+ch-6*S),(rx+34*S,y0+ch-6*S),(rx+34*S,y0+ch+58*S),(rx+17*S,y0+ch+40*S),(rx,y0+ch+58*S)],fill=RED)
          fg=fg.resize((1024,1024),Image.LANCZOS)
          bg=Image.new('RGBA',(1024,1024),(10,42,33,255))
          glow=Image.new('RGBA',(1024,1024),(0,0,0,0))
          ImageDraw.Draw(glow).ellipse([112,-200,912,600],fill=(29,84,67,150))
          bg=Image.alpha_composite(bg,glow.filter(ImageFilter.GaussianBlur(120)))
          os.makedirs('assets',exist_ok=True)
          fg.save('assets/icon-foreground.png'); bg.save('assets/icon-background.png')
          Image.alpha_composite(bg,fg).save('assets/icon-only.png')
          PY
          python mk_icon.py
          npx --yes @capacitor/assets@3 generate --android
      - run: npx cap sync android
      - name: Build
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: dafter-trix-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish download link
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk dafter-trix.apk
          gh release delete latest --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" || true
          gh release create latest dafter-trix.apk --repo "$GITHUB_REPOSITORY" --title "دفتر التركس" --notes "نزّل الملف وثبّته على أندرويد" --latest
